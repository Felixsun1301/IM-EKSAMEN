{% extends "index.html" %}
{% block content %}
<body>

<div class="container">
    <h1>FX Studios</h1>
    <p>Admin innlogging</p>

    {% if feil %}
    <p class="feil">{{ feil }}</p>
    {% endif %}

    <form action="/login" method="POST">

        <label for="brukernavn">Brukernavn:</label>

</div>

</body>
</html>
{% endblock %}
